
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Sistema de Becas</title>
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

    <div class="profile-layout">

        <!-- Sidebar izquierdo -->
        <aside class="profile-sidebar">

            <div class="sidebar-brand">
                <img src="../assets/img/logo-ifharu.png" alt="IFARHU">
                <h2>Portal Estudiantil</h2>
            </div>

            <div class="sidebar-user">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                    </svg>
                </div>

                <p>¡Hola, <span id="user-name">Estudiante</span>!</p>
            </div>

            <nav class="sidebar-navigation" aria-label="Menú del perfil">

                <a href="inicio.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 10 9-7 9 7"></path>
                        <path d="M5 9v12h14V9"></path>
                        <path d="M9 21v-7h6v7"></path>
                    </svg>
                    <span>Inicio</span>
                </a>

                <a href="perfil.html" class="sidebar-link active">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                    </svg>
                    <span>Mi perfil</span>
                </a>

            </nav>

            <div class="sidebar-bottom">
                <button type="button" class="logout-button" id="logout-button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5"></path>
                        <path d="M15 12H3"></path>
                        <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"></path>
                    </svg>
                    <span>Cerrar sesión</span>
                </button>
            </div>

        </aside>

        <!-- Área de contenido vacía -->
        <main class="profile-content">
            <!-- El contenido del perfil se agregará posteriormente. -->
        </main>

    </div>

    <script src="../js/perfil.js"></script>
</body>
</html>
