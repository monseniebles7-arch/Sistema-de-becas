<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Estudiantil | Sistema de Becas</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <main class="register-container">

        <!-- PANEL IZQUIERDO: 30 % -->
        <aside class="image-panel">
            <!-- Espacio reservado para la imagen institucional -->
            <img
                src="../assets/img/registro-estudiantil.png"
                alt="Imagen institucional del Sistema de Becas"
                class="institutional-image"
            >
        </aside>


        <!-- PANEL DERECHO: 70 % -->
        <section class="register-panel">

            <!-- ENCABEZADO: 15 % -->
            <header class="register-header">
                <h1>Sistema de Registro Estudiantil</h1>
            </header>


            <!-- FORMULARIO -->
            <form id="register-form" class="register-form">

                <div class="form-columns">

                    <!-- COLUMNA IZQUIERDA: DATOS GENERALES -->
                    <section class="general-data">

                        <h2>Datos Generales</h2>

                        <!-- Nombre y apellido -->
                        <div class="form-row">

                            <div class="form-group">
                                <label for="nombre">Nombre</label>

                                <div class="input-wrapper">
                                    <svg class="input-icon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.7"
                                         aria-hidden="true">
                                        <circle cx="12" cy="8" r="4"></circle>
                                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                                    </svg>

                                    <input
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        placeholder="Nombre"
                                        autocomplete="given-name"
                                        maxlength="100"
                                        required
                                    >
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="apellido">Apellido</label>

                                <div class="input-wrapper">
                                    <svg class="input-icon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.7"
                                         aria-hidden="true">
                                        <circle cx="12" cy="8" r="4"></circle>
                                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                                    </svg>

                                    <input
                                        type="text"
                                        id="apellido"
                                        name="apellido"
                                        placeholder="Apellido"
                                        autocomplete="family-name"
                                        maxlength="100"
                                        required
                                    >
                                </div>
                            </div>

                        </div>


                        <!-- Fecha de nacimiento -->
                        <div class="form-group">
                            <label for="fecha-nacimiento">
                                Fecha de nacimiento
                            </label>

                            <input
                                type="date"
                                id="fecha-nacimiento"
                                name="fecha_nacimiento"
                                autocomplete="bday"
                                required
                            >
                        </div>


                        <!-- Teléfono y correo -->
                        <div class="form-row">

                            <div class="form-group">
                                <label for="telefono">Teléfono</label>

                                <div class="input-wrapper">
                                    <svg class="input-icon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.7"
                                         aria-hidden="true">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                                        19.8 19.8 0 0 1-8.63-3.07
                                        19.5 19.5 0 0 1-6-6
                                        A19.8 19.8 0 0 1 2.12 4.18
                                        2 2 0 0 1 4.11 2h3
                                        a2 2 0 0 1 2 1.72
                                        c.12.96.36 1.9.7 2.8
                                        a2 2 0 0 1-.45 2.11L8.1 9.9
                                        a16 16 0 0 0 6 6l1.27-1.27
                                        a2 2 0 0 1 2.11-.45
                                        c.9.34 1.84.58 2.8.7
                                        A2 2 0 0 1 22 16.92z"></path>
                                    </svg>

                                    <input
                                        type="tel"
                                        id="telefono"
                                        name="telefono"
                                        placeholder="Teléfono"
                                        autocomplete="tel"
                                        maxlength="20"
                                        required
                                    >
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="correo">Correo electrónico</label>

                                <div class="input-wrapper">
                                    <svg class="input-icon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.7"
                                         aria-hidden="true">
                                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                        <path d="m3 7 9 6 9-6"></path>
                                    </svg>

                                    <input
                                        type="email"
                                        id="correo"
                                        name="correo"
                                        placeholder="Correo electrónico"
                                        autocomplete="email"
                                        maxlength="254"
                                        required
                                    >
                                </div>
                            </div>

                        </div>


                        <!-- Provincia -->
                        <div class="form-group">
                            <label for="provincia">Provincia</label>

                            <select id="provincia" name="provincia_id" required>
                                <option value="" selected disabled>
                                    Seleccione una provincia
                                </option>
                            </select>
                        </div>


                        <!-- Distrito -->
                        <div class="form-group">
                            <label for="distrito">Distrito</label>

                            <select id="distrito" name="distrito_id" required disabled>
                                <option value="" selected>
                                    Seleccione primero una provincia
                                </option>
                            </select>
                        </div>


                        <!-- Corregimiento -->
                        <div class="form-group">
                            <label for="corregimiento">Corregimiento</label>

                            <select
                                id="corregimiento"
                                name="corregimiento_id"
                                required
                                disabled
                            >
                                <option value="" selected>
                                    Seleccione primero un distrito
                                </option>
                            </select>
                        </div>


                        <!-- Dirección -->
                        <div class="form-group">
                            <label for="direccion">Dirección de residencia</label>

                            <textarea
                                id="direccion"
                                name="direccion"
                                placeholder="Ingrese su dirección de residencia"
                                rows="2"
                                maxlength="500"
                                required
                            ></textarea>
                        </div>

                    </section>


                    <!-- COLUMNA DERECHA: DATOS ACADÉMICOS -->
                    <section class="academic-data">

                        <h2>Datos Académicos</h2>

                        <div class="form-group">
                            <label for="nivel-educativo">Nivel educativo</label>

                            <select
                                id="nivel-educativo"
                                name="nivel_educativo_id"
                                required
                            >
                                <option value="" selected disabled>
                                    Seleccione un nivel educativo
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="institucion">Institución educativa</label>

                            <select
                                id="institucion"
                                name="institucion_id"
                                required
                                disabled
                            >
                                <option value="" selected>
                                    Seleccione primero un nivel educativo
                                </option>
                            </select>
                        </div>

                    </section>

                </div>


                <!-- BOTÓN INFERIOR IZQUIERDO -->
                <div class="register-actions">
                    <button type="submit" id="register-button">
                        Registrarme
                    </button>

                    <p id="register-message" role="status" aria-live="polite"></p>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
