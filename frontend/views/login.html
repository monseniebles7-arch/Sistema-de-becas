<div class="contenedor-login">
    <aside class="panel-institucional">
        <div class="marca">
            <img src="static/img/logo-ifarhu.png" alt="Logo de IFARHU" class="logo-institucional">
            <p class="entidad">Instituto para la Formación y Aprovechamiento de Recursos Humanos</p>
        </div>
        <div class="separador"></div>
        <h1>Sistema de Gestión de Becas</h1>
        <p class="pie-institucional">República de Panamá</p>
    </aside>
    <main class="panel-formulario">
        <div class="formulario-caja">
            <h2>Iniciar sesión</h2>
            <p class="subtitulo">Ingresa con tu cuenta.</p>
            <div id="login-message"></div>
            <form id="login-form">
                <label for="usuario">Usuario administrativo o correo estudiantil</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <button type="submit">Iniciar sesión</button>
            </form>
            <p><a href="#publico">Volver al inicio</a> · <a href="#registro">Crear cuenta estudiantil</a></p>
        </div>
    </main>
</div>
