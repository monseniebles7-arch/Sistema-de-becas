<h2>Registrar estudiante</h2>
<p>Complete los datos del estudiante para agregarlo al sistema.</p>
<div id="register-message"></div>
<div class="tarjeta-formulario">
    <form id="student-form">
        <div class="fila-campos">
            <div class="grupo-campo">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" required>
            </div>
            <div class="grupo-campo campo-autocompletar">
                <label for="universidad_busqueda">Centro educativo</label>
                <input type="text" id="universidad_busqueda" placeholder="Escriba el nombre del centro educativo" autocomplete="off" required>
                <input type="hidden" id="universidad_id" name="universidad_id">
                <ul class="lista-sugerencias" id="lista-sugerencias"></ul>
            </div>
        </div>
        <div class="fila-campos">
            <div class="grupo-campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="grupo-campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
        </div>
        <div class="fila-campos">
            <div class="grupo-campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo">
            </div>
            <div class="grupo-campo">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono">
            </div>
        </div>
        <div class="acciones-formulario">
            <button type="submit" class="boton-primario">Registrar estudiante</button>
            <a href="#inicio" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</div>
