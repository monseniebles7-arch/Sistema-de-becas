name: Frontend Robot UI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Robot Framework Browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install robotframework robotframework-browser
          rfbrowser init chromium --with-deps
      - name: Serve the frontend
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > frontend.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat frontend.log
          exit 1
      - name: Run Robot browser suite
        run: python -m robot --outputdir results/robot tests/robot/public_site.robot
      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-robot-report
          path: results/robot/
          if-no-files-found: ignore

